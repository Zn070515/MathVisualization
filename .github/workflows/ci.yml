# The merge gate.
#
# `pnpm verify` (root package.json) is the full Linux gate: lint, typecheck, test
# and build, in that order. The Windows job separately exercises the PowerShell
# setup path, which cannot be validated by an Ubuntu runner that skips it.
#
# Versions come from the repository rather than being repeated here: pnpm from
# `packageManager`, Node from `engines.node`. Bumping either is then a one-line
# change in package.json instead of a change in two places that can disagree.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before setup-node, because `cache: pnpm` needs pnpm on PATH to locate
      # the store it is going to cache.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Demo validation probes the committed WebM/GIF assets. CI does not record
      # browser video or load the developer's sibling Playwright repository.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm demo:test

      - run: pnpm verify

  windows-tooling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This includes the PowerShell runtime check. It is intentionally separate
      # from the Linux verification job so a skipped non-Windows test cannot make
      # the Windows path look covered.
      - run: pnpm test:tooling
